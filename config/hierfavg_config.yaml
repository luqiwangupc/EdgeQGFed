baseline:
  name: "hierfavg"

train:
  learning_rate: 3e-4
  total_steps: 3000
  log_step: 20
  evaluate_step: 100
  # Cloud aggregation period. In HierFAVG this corresponds to the
  # edge-cloud aggregation interval.
  ema_update_step: 50
  ckpt_save_path: "checkpoints"
  ckpt_save_name: "best_hierfavg_cifar10_d0.3.pth"
  class_fn: "CE"
  consis_fn: "MSE"
  optimizer: "AdamW"
  differential:
    use: False
    epsilon: 10
  warm_up_steps: 1
  initial_weight: 0.0
  final_weight: 0.0
  warm_mode: "linear"
  consistency_confidence_gate: False
  device: 0
  pseudo:
    use: False
    weight: 0.0
    start_step: 0
    edge_threshold: 1.0
    cloud_threshold: 1.0
    temperature: 1
    weight_temperature: 0.1
    min_weight: 1.0

topology:
  num_edges: 4
  num_clients: 128
  clients_per_round: 32
  edges_per_round: 4
  # HierFAVG uses ordinary random/balanced client participation.
  # Do not use resource_aware here, otherwise the baseline uses EdgeQGFed's module.
  client_sample_mode: "balanced"
  assignment: "round_robin"
  client_drop_rate: 0.0

datasets:
  name: "cifar10"
  seed: 0
  val_ratio: 0.1
  normalize: "imagenet"
  batch_size: 64
  # The original HierFAVG is fully supervised. Set this to 0.1 only when
  # comparing under the same weak-label protocol as EdgeQGFed.
  labeled_ratio: 0.1
  edge_num_workers: 2
  edge_prefetch_factor: 1
  eval_num_workers: 2
  pin_memory: True
  distributed: "nonIID"
  partition_mode: "client_dirichlet"
  partition_alpha: 0.3
  min_client_size: 16
  edge_dirichlet_alpha: 0.3
  client_dirichlet_alpha: 1.0
  edge_overlap_size: 5
  edge_overlap_shift: 1

models:
  encoder_name: "efficientv2s"
  classifier_name: "small-mlp"
  dropout_rate: 0.2
  ema_decay: 0.0
  ema_dynamic_decay: False
  pretrain_ckpt: null
  algorithm: "FedAvg"
  aggregation_mode: "auto"
  attack_rate: 0.0
  graph:
    use: False
    temperature: 0.5
    prototype_weight: 0.0
    reliability_weight: 0.0
    label_ratio_weight: 0.0
    confidence_weight: 0.0
    self_bias: 0.0
    min_attention: 0.0

network:
  round_comm_budget_mb: 1200
  client_uplink_bandwidth_mbps: 80
  edge_uplink_bandwidth_mbps: 400
  cloud_downlink_bandwidth_mbps: 800
  client_feature_dim: 1280
  budget:
    include_model_sync: True
  bandwidth:
    mode: "edge_profile"
    client_uplink_by_edge_mbps: [40, 60, 80, 120]
    edge_uplink_by_edge_mbps: [200, 300, 400, 600]
    cloud_downlink_by_edge_mbps: [400, 600, 800, 1000]
    client_distribution:
      type: "uniform"
      min_mbps: 10
      max_mbps: 120
    edge_distribution:
      type: "lognormal"
      median_mbps: 400
      sigma: 0.35
      min_mbps: 100
      max_mbps: 1000
    cloud_downlink_distribution:
      type: "uniform"
      min_mbps: 300
      max_mbps: 1200
  mobility:
    mode: "static"
    edge_drop_rates: [0.02, 0.05, 0.10, 0.15]
    handoff_probability: 0.05
    handoff_drop_boost: 0.20
    drop_jitter: 0.03
  latency:
    edge_compute_s: 0.0
    cloud_aggregation_s: 0.0
  resource_sampling:
    exploration_rate: 0.0
    label_ratio_weight: 0.0
    data_size_weight: 0.0
    bandwidth_weight: 0.0
    availability_weight: 0.0
    latency_cost_weight: 1.0
  max_parallel_uploads_per_edge: 8
  client_view_count: 1
  client_input_channels: 3
  client_image_size: 224
  bytes_per_value: 4
  target_accuracy: 75.0

pretrain:
  epochs: 20
  img_size: 224
  decoder_dim: 1024
  mask_ratio: 0.75
