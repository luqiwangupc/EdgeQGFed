train:
  learning_rate: 8.0e-4
  total_steps: 3000
  log_step: 20
  evaluate_step: 100
  ema_update_step: 10
  ckpt_save_path: "checkpoints"
  ckpt_save_name: "best_edgeqgfed_nslkdd_e1.pth"
  class_fn: "weighted_focal"
  consis_fn: "MSE"
  optimizer: "AdamW"
  class_balance:
    mode: "auto"
    labeled_only: True
    exponent: 0.65
    smoothing: 1.0
    min_weight: 0.35
    max_weight: 15.0
    focal_gamma: 2.0
    class_multipliers: [0.8, 0.8, 1.0, 3.0, 1.5]
  differential:
    use: False
    epsilon: 10
  warm_up_steps: 1500
  initial_weight: 0.0
  final_weight: 0.1
  warm_mode: "gaussian"
  consistency_confidence_gate: True
  device: 4
  pseudo:
    use: True
    weight: 0.03
    start_step: 2200
    edge_threshold: 0.97
    cloud_threshold: 0.97
    temperature: 1.0
    weight_temperature: 0.05
    min_weight: 0.6

topology:
  num_edges: 1
  num_clients: 100
  clients_per_round: 40 #40
  edges_per_round: 5
  client_sample_mode: "resource_aware"
  assignment: "round_robin"
  client_drop_rate: 0.0

datasets:
  name: "nslkdd"
  normalize: "none"
  batch_size: 32
  labeled_ratio: 0.1
  label_sampling: "stratified"
  min_labeled_per_client: 1
  balanced_labeled_batch_fraction: 0.35
  class_sampling_weights: [0.7, 0.8, 1.0, 4.0, 2.0]
  edge_num_workers: 0
  edge_prefetch_factor: 1
  eval_num_workers: 0
  pin_memory: False
  distributed: "nonIID"
  partition_mode: "client_dirichlet"
  partition_alpha: 0.3
  min_client_size: 4
  edge_dirichlet_alpha: 0.3
  client_dirichlet_alpha: 1.0
  edge_overlap_size: 2
  edge_overlap_shift: 1

models:
  encoder_name: "identity"
  classifier_name: "network-mlp"
  dropout_rate: 0.1
  ema_decay: 0.1
  ema_dynamic_decay: False
  pretrain_ckpt: null
  algorithm: "AEMA"
  aggregation_mode: "state_dict"
  attack_rate: 0.0
  graph:
    use: True
    temperature: 0.5
    prototype_weight: 0.35
    reliability_weight: 0.35
    label_ratio_weight: 0.2
    confidence_weight: 0.1
    self_bias: 0.3
    min_attention: 1.0e-4

network:
  round_comm_budget_mb: 200
  client_uplink_bandwidth_mbps: 20
  edge_uplink_bandwidth_mbps: 200
  cloud_downlink_bandwidth_mbps: 400
  budget:
    include_model_sync: True
  bandwidth:
    mode: "edge_profile"
    client_uplink_by_edge_mbps: [5, 10, 20, 30, 50]
    edge_uplink_by_edge_mbps: [80, 120, 200, 300, 400]
    cloud_downlink_by_edge_mbps: [150, 250, 400, 500, 600]
    client_distribution:
      type: "uniform"
      min_mbps: 2
      max_mbps: 50
    edge_distribution:
      type: "lognormal"
      median_mbps: 200
      sigma: 0.35
      min_mbps: 50
      max_mbps: 500
    cloud_downlink_distribution:
      type: "uniform"
      min_mbps: 100
      max_mbps: 600
  mobility:
    mode: "static"
    edge_drop_rates: [0.02, 0.05, 0.10, 0.15, 0.20]
    handoff_probability: 0.05
    handoff_drop_boost: 0.20
    drop_jitter: 0.03
  latency:
    edge_compute_s: 0.0
    cloud_aggregation_s: 0.0
  resource_sampling:
    exploration_rate: 0.05
    label_ratio_weight: 0.35
    data_size_weight: 0.25
    bandwidth_weight: 0.25
    availability_weight: 0.15
    latency_cost_weight: 1.0
  max_parallel_uploads_per_edge: 10
  client_view_count: 3
  client_input_channels: 1
  client_image_size: 1
  client_feature_dim: 122
  bytes_per_value: 4
  target_accuracy: 75.0

pretrain:
  epochs: 20
  img_size: 32
  decoder_dim: 1024
  mask_ratio: 0.75
