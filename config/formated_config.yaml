train:
  learning_rate: 3e-4
  total_steps: 3000
  log_step: 20
  evaluate_step: 100
  ema_update_step: 50
  ckpt_save_path: "checkpoints"
  ckpt_save_name: "best_edgeqgfed_cifar10_c256.pth"
  class_fn: "CE"
  consis_fn: "MSE"
  optimizer: "AdamW"
  differential:
    use: False
    epsilon: 10
  warm_up_steps: 1000
  initial_weight: 0.0
  final_weight: 0.4
  warm_mode: "gaussian"
  consistency_confidence_gate: True
  device: 5
  pseudo:
    use: True
    weight: 0.25
    start_step: 500
    edge_threshold: 0.55
    cloud_threshold: 0.7
    temperature: 1
    weight_temperature: 0.1
    min_weight: 0.1

topology:
  num_edges: 4
  num_clients: 256
  clients_per_round: 32
  edges_per_round: 4
  client_sample_mode: "resource_aware"
  assignment: "round_robin"
  client_drop_rate: 0.1

datasets:
  name: 'cifar10'
  seed: 0
  val_ratio: 0.1
  normalize: "imagenet"
  batch_size: 64
  labeled_ratio: 0.1
  edge_num_workers: 2
  edge_prefetch_factor: 1
  eval_num_workers: 2
  pin_memory: True
  distributed: "nonIID"
  partition_mode: "client_dirichlet"
  partition_alpha: 0.3
  min_client_size: 16
  edge_dirichlet_alpha: 0.3
  client_dirichlet_alpha: 1.0
  edge_overlap_size: 5
  edge_overlap_shift: 1

models:
  encoder_name: "efficientv2s"
  classifier_name: "small-mlp"
  dropout_rate: 0.2
  ema_decay: 0.5
  ema_dynamic_decay: False
  pretrain_ckpt: null
  algorithm: "AEMA"
  aggregation_mode: "auto"
  attack_rate: 0.0
  graph:
    use: True
    temperature: 0.5
    prototype_weight: 0.35
    reliability_weight: 0.35
    label_ratio_weight: 0.2
    confidence_weight: 0.1
    self_bias: 0.3
    min_attention: 1.0e-4

network:
  round_comm_budget_mb: 1200 #默认是1200,600,900,300,,实际只用了22.5，所以改为20， 50，120
  client_uplink_bandwidth_mbps: 80
  edge_uplink_bandwidth_mbps: 400
  cloud_downlink_bandwidth_mbps: 800
  budget:
    include_model_sync: True
  bandwidth:
    # Options: homogeneous, edge_profile, sampled_distribution.
    mode: "edge_profile"
    # Option 1: deterministic heterogeneous edge profiles.
    client_uplink_by_edge_mbps: [40, 60, 80, 120]
    edge_uplink_by_edge_mbps: [200, 300, 400, 600]
    cloud_downlink_by_edge_mbps: [400, 600, 800, 1000]
    # Option 2: stochastic client/edge bandwidth profiles.
    client_distribution:
      type: "uniform"
      min_mbps: 10
      max_mbps: 120
    edge_distribution:
      type: "lognormal"
      median_mbps: 400
      sigma: 0.35
      min_mbps: 100
      max_mbps: 1000
    cloud_downlink_distribution:
      type: "uniform"
      min_mbps: 300
      max_mbps: 1200
  mobility:
    # Options: static, edge_profile, mobility.
    mode: "static"
    edge_drop_rates: [0.02, 0.05, 0.10, 0.15]
    handoff_probability: 0.05
    handoff_drop_boost: 0.20
    drop_jitter: 0.03
  latency:
    edge_compute_s: 0.0
    cloud_aggregation_s: 0.0
  resource_sampling:
    exploration_rate: 0.05
    label_ratio_weight: 0.35
    data_size_weight: 0.25
    bandwidth_weight: 0.25
    availability_weight: 0.15
    latency_cost_weight: 1.0
  max_parallel_uploads_per_edge: 8
  client_view_count: 3
  client_feature_dim: 1280
  client_input_channels: 3
  client_image_size: 224
  bytes_per_value: 4
  target_accuracy: 75.0

pretrain:
  epochs: 20
  img_size: 224
  decoder_dim: 1024
  mask_ratio: 0.75
